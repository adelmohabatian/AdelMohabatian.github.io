name: WebSocial editorial pilot preview (never public)
on:
  push:
    branches: [content-studio-dev]
    paths:
      - '.pages.yml'
      - 'content/pilot/**'
      - 'tools/websocial_online_pilot_builder.py'
      - '.github/workflows/websocial-editorial-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current editorial branch
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image optimizer
        run: python -m pip install 'Pillow>=10,<13'
      - name: Build review package (drafts included, no deployment)
        run: |
          python tools/websocial_online_pilot_builder.py --base-zip releases/site.zip --data content/pilot/carpet.json --media-dir content/pilot/media --output preview/pilot-site.zip --include-drafts
      - name: Store private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocial-editorial-review
          path: preview/pilot-site.zip
          retention-days: 7
